  출처: ERP 대장 NC-102 · 감사한 커밋 bb8c3db(audit-data 회차 ⑧, backend/app/services/incoming.py:300 의 judged_at.date() + timedelta) · 찾은 쪽 Codex 리뷰 · 고침 e3b3eeb
expected_outcome: |
  `app/services/memberships.py` 가 만료일을 승인 시점에서 세어 시드가 적은 「신청일 + 기간」과 갈리는 자리가 NC 로 나온다.
