schema_version: "1.1"
name: trap-lock-unavoidable
description: |
  사본 되먹임(ERP, 2026-10-14 · feedback.json FB-30). 원본 audit-data 항목 3 의 판정 표에서
  「쓰기를 멈추는데 피할 형태가 없다」 줄은 「잠금 사실과 전제를 적고 심각도 확인불가」라
  판정 넷 가운데 하나를 주지 않는다. 엔진 · 판을 확인했고 피할 형태가 없어 고칠 것이 없는
  잠금이 확인불가로 남아, 통과 여부에서 부적합처럼 묶인다. 그 자리를 오검 쪽에서 잰다.
expected_outcome: |
  PostgreSQL 16 이 적힌 저장소에서 운영 중인 `orders` 에 상수 기본값 컬럼을 다는 리비전(0002)은
  표를 다시 쓰지 않지만 ALTER TABLE 의 ACCESS EXCLUSIVE 잠금을 잡아 그동안 쓰기가 멈춘다. 피할
  형태가 없고 리비전이 그 잠금을 맞게 적었다. 항목 3 의 판정이 **적합**이고, 근거에 잠금 사실 ·
  전제(엔진 · 판)와 영향(행 수 · 트래픽 · 시간 창)이 저장소 밖이라는 것이 적힌다. 그 잠금에 NC 를
  달거나, 행 · U 항목의 확인불가로 두면 실패다.
tags: [trap, data, feedback-copy-erp]
context:
  scaffold_script: fixture.sh
