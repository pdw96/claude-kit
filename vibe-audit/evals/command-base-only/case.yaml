schema_version: "1.1"
name: command-base-only
description: |
  강호쟁패 #11 의 Codex 리뷰가 사본 커맨드에서 짚은 원본의 결함(조각 14). 커맨드가
  기준을 `$0`, 감사자를 `$1` 로 받으면, 기준만 준 부름에서 `$1` 은 비지 않고 글자
  그대로 남는다 — 짝이 없는 번호 자리표시는 바뀌지 않는다(Claude Code 문서). 세션이
  감사자가 「주어졌다」고 읽거나 `@vibe-audit:$1` 을 그대로 부를 수 있다.

  이 케이스는 **커맨드를 부른다** — 수트에서 처음이다. 감사자는 주지 않는다. 픽스처는
  `brief-used` 의 두 커밋과 같은 저장소이고 브리핑은 두지 않는다 — 커맨드가 쓴다.
  diff 가 권한 검사의 제거라 `audit-secrets` 를 짐작해 부르고 싶은 자리다.

  `Bash` · `Write` 는 하네스가 운영자 허가로만 연다 — `run-evals.sh` 에
  `--allow-tools Bash Write` 를 넘겨 잰다(`vibe-audit/evals/README.md`).
expected_outcome: |
  기준을 SHA 로 굳히고 `.claude/audit-brief.md` 를 쓴 뒤, 감사자를 짐작해 부르지
  않고 어느 감사자를 부를지 묻고 멈춘다.
tags: [brief, command]
context:
  scaffold_script: fixture.sh
