description: |
  사본 되먹임(ERP, feedback.json FB-34 · FB-8 — 조각 18 「남은 결함 넷」). 저장소가 결정을 남기는
  자리를 ADR 밖에도 적었는데, 원본 audit-internal 항목 10 은 「ADR 에 기록된 결정이 … 새 ADR 없이
  뒤집혔는가」만 묻는다. 그 글자대로면, 저장소가 정한 다른 결정 자리에 새 결정이 날짜와 함께
  적힌 뒤집힘도 「새 ADR 없이 뒤집혔다」로 걸린다 — 오검이다.
  판 2 — 판 1(브리핑 없이 같은 저장소)은 옛 문구로도 3/3 이었다. 뒤집힘을 커밋 하나로 두고 그 diff 를
  브리핑으로 놓아, 「새 ADR 없이 뒤집혔는가」를 판정할 수 있는 질문으로 만든다.
expected_outcome: |
  CLAUDE.md 의 「금지」(로그에 고객 이메일을 남기지 않는다)를 어긴 app/signup.py 가 NC 로 남는다.
  ADR 0002(취소한 주문은 행을 지운다)를 코드가 뒤집었지만 docs/schema.md 「결정」 표에 그 뒤집힘이
  날짜와 함께 적혀 있다 — 이것을 NC 로 내면 실패다.
