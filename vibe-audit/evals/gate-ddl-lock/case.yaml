schema_version: "1.1"
name: gate-ddl-lock
description: |
  사본 되먹임(ERP, 2026-10-05 · feedback.json FB-3 · 4). 원본 audit-data 의 항목 3 은
  「기존 행 위에서 마이그레이션이 통과하는가」만 묻는다. 논리적으로 통과하는
  마이그레이션이 운영 중인 표를 잠가 그동안의 쓰기를 멈추는 자리는 그 물음에
  걸리지 않았다 — 「통과한다」로 적합이 났다. 일반형으로 옮기며 더한 규칙 하나를 여기서
  잰다: 잠금은 엔진 · 판마다 다르므로 그것을 저장소에서 확인하지 못하면 확인불가다.
expected_outcome: |
  운영 중인 `orders` 에 인덱스와 CHECK 를 거는 리비전(0013)의 잠금 판정이, 엔진 · 판을
  저장소에서 확인할 수 없으므로 **확인불가**로 남고 무엇(엔진 · 판)을 모르는지가 적힌다.
  흔한 엔진을 가정해 부적합으로 단정하거나, 「통과한다」로 적합을 내면 실패다.
tags: [gate, data, feedback-copy-erp]
