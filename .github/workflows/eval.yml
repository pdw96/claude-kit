          sed -i 's/^weight: .*/weight: 2/' "$s/vibe-audit/evals/gap-unowned/graders/gate-no-fake-owner.md"
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
