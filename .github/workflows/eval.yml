# 원본이 자기 수트를 통과하는지 무는 게이트.
#
# verify-copy.py 는 사본이 원본과 같은지만 본다 — 원본이 맞는지는 아무도 안
# 봤다. 이 워크플로가 그 자리다.
#
# 잡이 둘인 이유: 모델을 부르는 검사는 키가 있어야 돈다. 키가 없을 때 그 잡이
# exit 0 으로 끝나면 **아무것도 검사하지 않고 초록이 난다** — 이 저장소가
# 고치겠다는 바로 그 결함이다. 그래서 키 없이 도는 것(gate)과 키가 있어야
# 도는 것(eval)을 갈랐다.
#
# **판정은 셋째 잡(verdict)이 낸다.** 처음엔 「키가 없으면 eval 이 Skipped 로
# 뜨니 초록이 아니다」라고 적었는데 틀렸다 — GitHub 은 건너뛴 잡을 필수 체크에서
# **성공**으로 센다. 포크나 Dependabot PR 은 시크릿을 못 받으니 gate 만 돌고
# 초록으로 머지될 수 있었다(Codex 리뷰). verdict 는 늘 돌고, 수트가 돌아 통과했거나
# 같은 입력이 이미 통과했을 때만 통과한다. 필수 체크로 걸 것은 이 잡이다.
name: eval

on:
  # **PR 은 거르지 않는다.** verdict 를 필수 체크로 걸면, 경로 필터로 워크플로가
  # 아예 안 뜬 PR(루트 README 만 고친 PR 등)은 그 체크가 영영 대기로 남아 머지할 수
  # 없다(Codex 리뷰). 비싼 것은 잡 안에서 거른다 — 수트의 입력이 안 바뀐 PR 은
  # 지문이 같아 gate 가 캐시에서 「이미 통과」를 찾고 eval 을 건너뛴다. 전에 경로
  # 필터에 루트 파일을 하나씩 더해 가던 것(LICENSE · copies.json …)도 이로써 필요 없다.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# **같은 PR 의 앞선 실행은 취소한다.** 한 커밋에 pull_request 실행이 1초 차로 둘 떠 수트를
# 두 번 돌린 일이 있었고(run 35999877690 · 35999878954), 구독 토큰의 사용량 한도를 두 배로
# 썼다. 새 커밋을 올리면 앞 커밋의 수트도 쓸모가 없으므로 같이 끊는다.
# **러너와 액션 판 (2026-10-05, 저자가 정했다).** 러너는 `ubuntu-24.04` 로 박는다 —
# `ubuntu-latest` 는 10월 19일부터 Ubuntu 26 을 가리켜, 이 파일을 안 고쳐도 도는 곳이
# 바뀐다. 26 으로는 직접 올린다. 액션은 Node 24 로 도는 최신 메이저(checkout · setup-node
# v7, cache v6, upload-artifact v7) — v4 는 Node 20 이라 잡마다 폐기 경고와 punycode ·
# url.parse 경고를 냈다. setup-node 는 v5 부터 package.json 을 보고 캐시를 켜는데, 이
# 저장소엔 package.json 이 없고 eval 잡은 시크릿을 받으므로 `package-manager-cache: false`
# 로 끈다(그 액션 README 의 권고).
concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 키 없이 도는 것. 언제나 물어야 한다 — 변조 시험은 같은 지문이 이미 물었을 때만 건너뛴다(아래 「변조 시험 지문」).
  gate:
    runs-on: ubuntu-24.04
    # 머지된 PR 의 통과를 읽는 API 두 곳(아래 「머지된 PR 이 통과했는가」 · 「머지된 PR 의 변조 시험이 물었는가」)이
    # actions · pull-requests 를 읽는다.
    # 캐시 액션은 이 토큰이 아니라 러너의 캐시 토큰을 쓴다. 다른 잡은 저장소 기본값 그대로다.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
      # 같은 지문이 이미 통과했으면 false — main 범위에서 찾았거나, main 푸시가 머지된 PR 의
      # merge ref 에서 찾았다. 찾아보지 않은 경우(workflow_dispatch)엔 둘 다 비어 있어 true 가
      # 된다 — 모르면 돈다.
      fresh: ${{ steps.seen.outputs.cache-hit != 'true' && steps.merged.outputs.hit != 'true' }}
    steps:
      # 역사 전체를 받는다. verify-copies.py 는 대장의 synced_commit 을 이 저장소에서
      # 찾고 그 커밋의 원본과 검사기로 사본을 견준다. 기본(깊이 1)이면 머리 커밋 하나만
      # 받아, 대장에 한 줄이라도 생기는 순간 「심었다는 커밋이 없다」로 gate 가 떨어진다
      # — sync-agents.sh 는 대장을 적는 커밋보다 앞선 HEAD 를 적으므로 늘 그렇다
      # (Codex 리뷰 · 깊이 1 클론에서 재현).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install -g @anthropic-ai/claude-code

      # **같은 지문이 이미 물었으면 변조 시험 다섯을 건너뛴다(조각 35 · ADR 0046).** gate 잡의 거의 전부가
      # 변조 시험인데, 그것이 보는 것 — 검사 코드가 무는지 — 은 검사 코드와 그것이 규칙으로 읽는 파일이
      # 그대로면 같다. 지문은 scripts/gate-key.py 가 낸다(무엇이 드는지는 그 파일 머리에). 검사와 자체 시험
      # 스물둘은 건너뛰는 실행에서도 늘 돈다 — 건너뛰는 몫은 gates.sh 의 `bites` 묶음이 든다.
      #
      # 수트 캐시(.eval-pass · `eval-route-`)와 같은 모양이고, 폴더와 키의 머리가 달라 서로를 찾지 않는다.
      # 인자 없이 돈 gates.sh 가 통과한 실행만 적는다 — 건너뛴 실행 · 떨어진 실행은 적지 않는다. 사람이 부른
      # workflow_dispatch 는 찾아보지 않고 늘 다 돌고, 통과하면 적는다.
      #
      # 그래도 다시 돌리려면 Actions → Caches 에서 `gate-bite-` 로 시작하는 항목을 지우고 재실행한다. main 은
      # 머지된 PR 의 merge ref 에 적힌 항목도 읽으므로 `refs/heads/main` 과 그 PR 의 항목을 둘 다 지우거나
      # workflow_dispatch 를 부른다.
      #
      # 지문을 못 내면 경고하고 찾지도 적지도 않고 다 돈다 — 모르면 돈다(설계 ② E5).
      #
      # **이 적기 · 건너뛰기 조건은 scripts/verify-eval-gate.py 가 문다(조각 37 · ADR 0048).** 이 잡의 첫 스텝부터
      # 「변조 시험까지 통과한 지문을 적는다」 뒤의 캐시 저장까지 열한 스텝의 판정에 드는 칸 — id · if · env · with ·
      # run 의 명령 줄 — 을 그 파일의 닫힌 목록(SPEC)과 글자 그대로 견준다. 그 칸을 고치면 SPEC 도 함께 고친다.
      # 알림 echo · 주석 · 스텝 이름 · 액션의 판은 자유다.
      - name: 변조 시험 지문
        id: gfp
        run: |
          if key=$(python3 scripts/gate-key.py) && [[ $key =~ ^gate-bite-py[^[:space:]]+-git[^[:space:]]+-[0-9a-f]{24}$ ]]; then
            echo "key=$key" >> "$GITHUB_OUTPUT"
            echo "변조 시험 지문: $key"
          else
            echo "::warning::변조 시험의 지문을 내지 못했다 — 찾지도 적지도 않고 변조 시험까지 다 돈다"
          fi

      - name: 같은 지문이 이미 물었는가
        id: gseen
        if: steps.gfp.outputs.key != '' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v6
        with:
          path: .gate-pass
          key: ${{ steps.gfp.outputs.key }}

      # main 푸시는 머지된 PR 의 통과도 읽는다 — 판정은 수트의 「머지된 PR 이 통과했는가」(아래)와 같은
      # scripts/eval-merged-pass.py 다. 판정은 키를 가리지 않는다(ADR 0021 의 1 ~ 3 · ADR 0046 의 6).
      # 못 읽으면 경고하고 다 돈다.
      - name: 머지된 PR 의 변조 시험이 물었는가
        id: gmerged
        if: github.event_name == 'push' && steps.gfp.outputs.key != '' && steps.gseen.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEY: ${{ steps.gfp.outputs.key }}
        run: python3 scripts/eval-merged-pass.py "$KEY"

      # 찾았으면 같은 키를 main 범위에도 적는다 — 다음 PR 들은 main 범위에서 읽는다.
      - name: 변조 시험 지문을 main 에도 적는다
        if: steps.gmerged.outputs.hit == 'true'
        env:
          PR: ${{ steps.gmerged.outputs.pr }}
          CREATED: ${{ steps.gmerged.outputs.created }}
        run: |
          mkdir -p .gate-pass
          echo "PR #$PR 의 refs/pull/$PR/merge 캐시($CREATED 에 적힘) — 그것을 읽은 main 실행 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_SHA)" > .gate-pass/run.txt

      - uses: actions/cache/save@v6
        if: steps.gmerged.outputs.hit == 'true'
        with:
          path: .gate-pass
          key: ${{ steps.gfp.outputs.key }}

      # 찾았으면 근거(통과한 실행의 URL · 커밋과 지문)를 notice 와 gates.sh 의 끝 줄에 남기고 스물둘만 돌린다.
      # 찾았는데 근거 파일이 비었으면 경고하고 다 돈다. `full` 은 아래 적기가 「인자 없이 돌았다」를 아는 길이다.
      - name: 키 없이 도는 게이트
        id: gates
        env:
          KEY: ${{ steps.gfp.outputs.key }}
          HIT: ${{ steps.gseen.outputs.cache-hit == 'true' || steps.gmerged.outputs.hit == 'true' }}
        run: |
          if [ "$HIT" = true ] && [ -s .gate-pass/run.txt ]; then
            why="같은 지문($KEY)이 이미 물었다 — $(head -n 1 .gate-pass/run.txt)"
            echo "::notice::변조 시험 다섯을 건너뛴다 — $why"
            ./scripts/gates.sh --skip-bite "$why"
          else
            if [ "$HIT" = true ]; then
              echo "::warning::같은 지문을 찾았는데 .gate-pass/run.txt 가 비었다 — 근거 없이 건너뛰지 않고 다 돈다"
            fi
            echo "full=true" >> "$GITHUB_OUTPUT"
            ./scripts/gates.sh
          fi

      # 변조 시험까지 다 돌아 통과한 지문만 적는다 — 건너뛴 실행은 적지 않는다(설계 ② E4). 이 조건은
      # scripts/verify-eval-gate.py 가 문다(위 「변조 시험 지문」 스텝의 주석).
      - name: 변조 시험까지 통과한 지문을 적는다
        id: gpass
        if: steps.gates.outputs.full == 'true' && steps.gfp.outputs.key != ''
        run: |
          mkdir -p .gate-pass
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_SHA)" > .gate-pass/run.txt

      - uses: actions/cache/save@v6
        if: steps.gpass.outcome == 'success'
        with:
          path: .gate-pass
          key: ${{ steps.gfp.outputs.key }}

      # 자격은 둘 중 하나다 — 구독 토큰(`claude setup-token` 이 만든
      # CLAUDE_CODE_OAUTH_TOKEN) 또는 API 키(ANTHROPIC_API_KEY). 저자는 구독을 쓴다.
      - name: 키가 있는가
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${OAUTH:-}" ] || [ -n "${API_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN 도 ANTHROPIC_API_KEY 도 없어 감사자 수트가 돌지 않는다 — verdict 잡이 실패한다"
          fi

      # **같은 입력이 이미 통과했으면 수트를 다시 안 돌린다.** 구독 사용량에서
      # 한 번에 `route-*` 열 × 3회가 나가는데, README 만 고친 커밋에도 그것을 썼다. 지문은
      # scripts/eval-key.py 가 내용으로 만든다(무엇이 드는지는 그 파일 머리에).
      #
      # 통과한 실행만 지문을 적는다(아래 eval 잡 끝). 그래서 빨간 커밋 뒤에 README
      # 한 줄을 얹어도 지문이 **통과한 적 없는** 것이라 다시 돈다. 사람이 부른
      # workflow_dispatch 는 찾아보지 않고 늘 돈다.
      #
      # 그래도 다시 돌리고 싶으면 Actions → Caches 에서 `eval-route-` 로 시작하는
      # 항목을 지우고 재실행한다. main 은 머지된 PR 의 merge ref 에 적힌 항목도 읽으므로
      # (아래 「머지된 PR 이 통과했는가」) `refs/heads/main` 과 그 PR 의 항목을 둘 다
      # 지우거나 workflow_dispatch(전수)를 부른다.
      - name: 수트 지문
        id: fp
        if: steps.key.outputs.has_key == 'true'
        run: echo "key=$(python3 scripts/eval-key.py route)" >> "$GITHUB_OUTPUT"

      - name: 같은 입력이 이미 통과했는가
        id: seen
        if: steps.key.outputs.has_key == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v6
        with:
          path: .eval-pass
          key: ${{ steps.fp.outputs.key }}

      # 머지 전에 아래 판정이 쓸 API 두 곳을 PR 실행에서 읽어 보기만 한다 — 권한과 응답의
      # 꼴을 PR 의 로그에서 본다. 판정에 쓰지 않아 fresh 에 들지 않고, 실패는 경고뿐이다
      # (ADR 0021 의 4).
      - name: API 를 읽어 본다
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/eval-merged-pass.py --probe

      # **main 푸시는 머지된 PR 의 통과도 읽는다.** PR 실행이 적은 캐시는 그 PR 의 merge
      # ref 범위라 main 의 restore 가 못 읽어, 지문을 바꾼 PR 은 머지 뒤 같은 키로 수트가 한
      # 번 더 돌았다. 이 푸시를 머지 커밋으로 가진 PR 하나의 merge ref 에 같은 키가 있으면
      # 건너뛴다 — 조건은 scripts/eval-merged-pass.py 가 들고(ADR 0021 의 1 ~ 3), 그것이
      # 무는지는 gates.sh 가 본다. 못 읽으면 경고하고 돈다.
      - name: 머지된 PR 이 통과했는가
        id: merged
        if: github.event_name == 'push' && steps.key.outputs.has_key == 'true' && steps.seen.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEY: ${{ steps.fp.outputs.key }}
        run: python3 scripts/eval-merged-pass.py "$KEY"

      # 찾았으면 같은 키를 main 범위에도 적는다 — 다음 PR 들은 main 범위에서 읽는다.
      - name: main 에도 적는다
        if: steps.merged.outputs.hit == 'true'
        env:
          PR: ${{ steps.merged.outputs.pr }}
          CREATED: ${{ steps.merged.outputs.created }}
        run: |
          mkdir -p .eval-pass
          echo "PR #$PR 의 refs/pull/$PR/merge 캐시($CREATED 에 적힘) — 그것을 읽은 main 실행 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_SHA)" > .eval-pass/run.txt

      - uses: actions/cache/save@v6
        if: steps.merged.outputs.hit == 'true'
        with:
          path: .eval-pass
          key: ${{ steps.fp.outputs.key }}

      # 건너뛴 eval 잡은 키가 없을 때와 똑같이 Skipped 로 뜬다. 둘은 verdict 가
      # 가르고(키 없음은 실패), 여기서는
      # 무엇을 근거로 건너뛰었는지 볼 수 있게 통과했던 실행을 찍는다.
      - name: 건너뛰는 근거
        if: steps.seen.outputs.cache-hit == 'true' || steps.merged.outputs.hit == 'true'
        run: |
          echo "::notice::수트를 건너뛴다 — 같은 입력(${{ steps.fp.outputs.key }})이 이미 통과했다: $(cat .eval-pass/run.txt)"

  # 키가 있어야 도는 것. 없으면 Skipped 로 뜨고, 판정은 아래 verdict 가 낸다.
  #
  # **무엇을 얼마나 돌리나 — 저자가 정했다(2026-09-23).** PR 과 push 는
  # 트리거 케이스(`route-*`)만, 판정 케이스까지 도는 전수는 workflow_dispatch
  # 로 사람이 부를 때만. 트리거는 문구를 고친 PR 에서 가장 자주 깨지는 축이고
  # 심판을 안 써서 싸다(`route-*` 열 × 3회 — 정할 때는 여섯 × 3회에 약 $5 였다). 전수는
  # 심판(sonnet)까지 불러 열 배쯤 든다.
  #
  # **러너를 부르는 이유.** 전에는 여기서 `claude plugin eval` 을 직접 불렀다.
  # 그러면 러너가 박아 둔 것이 전부 빠진다 — 동시성(기본 1 이라 전수가 두
  # 시간), 케이스 0개면 실패, 실패 트레이스 보존. 그리고 플러그인 없는 팔이
  # 기본으로 붙어 비용이 두 배가 되어, 키를 넣는 순간 `--max-cost-usd 10` 에
  # 걸려 **모든 PR 이 빨갛게** 떴을 것이다. 깃발을 두 군데 적으면 갈린다 —
  # `gates.sh` 를 만든 것과 같은 이유다.
  #
  # `--ablation none` — 플러그인 없는 팔은 감사자를 부를 수 없어 트리거
  # 케이스에서 늘 0 이다. 재는 것이 없는데 값은 두 배다.
  eval:
    runs-on: ubuntu-24.04
    needs: gate
    if: needs.gate.outputs.has_key == 'true' && needs.gate.outputs.fresh == 'true'
    # 시한의 근거는 로컬 실측 하나다 — 동시성이 1 이던 때 열세 케이스에 123분이 걸렸다
    # (docs/eval-log/2026-09-16_2026-10-06.md 「전수 회귀 — 문구가 +57% 자란 뒤에도 버티는가」).
    # 지금은 러너 기본 -j 4 · 케이스 스물여섯이다. 설치와 자격 확인까지 한 잡에 들어가므로
    # 넉넉히 둔다 — 잘리면 결과도 아티팩트도 안 남는다(Codex 리뷰).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install -g @anthropic-ai/claude-code

      # **이 자격을 받는 사람은 쓰기 권한자뿐이다 — 저자가 이 위험을 받아들였다.**
      # 같은 저장소 브랜치의 PR 은 저장소 시크릿을 받고, PR 이 고친 스크립트와
      # 워크플로가 그 자격으로 돈다(Codex 7차). 포크 · Dependabot PR 은 시크릿을 못
      # 받고 verdict 가 빨갛게 둔다. 지금 쓰기 권한자는 저자 한 명이다.
      # **협업자를 들이면** 시크릿을 저장소 시크릿에서 승인자가 걸린 environment 로
      # 옮기고 이 잡에 `environment:` 를 건다 — 스크립트를 기준 브랜치에서 가져오는
      # 것으로는 안 막힌다. pull_request 는 PR 쪽의 워크플로 파일로 돈다.
      #
      # **하나만 내보낸다.** 둘 다 env 에 두면 비어 있는 쪽도 「설정됨」으로 읽혀
      # 다른 쪽을 가릴 수 있다 — CLI 는 ANTHROPIC_API_KEY 를 먼저 본다. 둘 다
      # 있으면 구독 토큰을 쓴다.
      #
      # **먼저 한 턴으로 자격을 확인한다.** 자격이 안 먹으면 수트는 회차마다
      # 오류로 0 점을 내고, 그것은 「감사자가 안 떴다」와 모양이 같다. 여기서
      # 먼저 떨어지면 원인이 자격이라는 것이 로그 첫 줄에 남는다.
      - name: 감사자 수트
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -n "${OAUTH:-}" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH"; echo "자격: 구독 토큰"
          else
            export ANTHROPIC_API_KEY="$API_KEY"; echo "자격: API 키"
          fi
          unset OAUTH API_KEY

          if ! out=$(claude -p "OK 한 단어로만 답하라" --max-turns 1 2>&1); then
            echo "::error::자격 확인 실패 — 수트를 돌리지 않는다: ${out:0:300}"; exit 1
          fi
          echo "자격 확인: ${out:0:40}"

          if [ "$FULL" = "true" ]; then
            ./scripts/run-evals.sh --ablation none --runs 3 --threshold 0.8 --max-cost-usd 40
          else
            # route 는 문턱 1.0 — 세 회차 **전부** 맞아야 한다. 문턱은 회차 평균에 걸리므로
            # 0.8 이면 한 회차의 과잉 트리거가 (1 + 1 + 0.67) / 3 = 0.89 로 지나가고, 그
            # 입력이 캐시에 「통과」로 남는다(Codex 리뷰). route 는 심판 없는 결정론 채점이고
            # 실측이 여러 번 만점이라 흔들림 여유를 둘 까닭이 없다. 판정 케이스(전수)는 심판이
            # 갈리므로 0.8 을 둔다.
            #
            # -j 8 은 시험이다(2026-10-05, 저자가 정했다). 러너 기본 -j 4 로 24회가 16분 남짓
            # 걸렸다. 같은 자격의 요금 한도에 부딪혀 더 느려지면 이 깃발을 뺀다 — 결과는
            # evals/README 「CI 정비」.
            ./scripts/run-evals.sh --case 'route-*' --ablation none --runs 3 --threshold 1.0 --max-cost-usd 10 -j 8
          fi

      # 통과한 입력만 적어 둔다. 지문은 이 잡에서 다시 낸다 — gate 잡과 CLI 가
      # 사이에 올라갔으면 실제로 돈 쪽의 지문을 적어야 하기 때문이다. 전수
      # (workflow_dispatch)는 찾아보지도 않으므로 적지 않는다.
      - name: 통과한 입력을 적는다
        id: pass
        if: success() && github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p .eval-pass
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_SHA)" > .eval-pass/run.txt
          echo "key=$(python3 scripts/eval-key.py route)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v6
        if: steps.pass.outcome == 'success'
        with:
          path: .eval-pass
          key: ${{ steps.pass.outputs.key }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-result
          path: vibe-audit/evals/results/
          if-no-files-found: ignore

  # **판정.** 건너뛴 잡은 GitHub 에서 성공으로 센다 — 그래서 「Skipped 는 초록이
  # 아니다」는 워크플로 모양만으로는 서지 않는다. 이 잡이 늘 돌아 다음 둘 중
  # 하나일 때만 통과한다: 감사자 수트가 돌아 통과했다, 또는 같은 입력이 이미
  # 통과했다(gate 의 지문 캐시). 자격이 없어 안 돈 것은 **실패**다 — 안 돌린 것을
  # 통과로 세지 않는다.
  verdict:
    runs-on: ubuntu-24.04
    needs: [gate, eval]
    if: always()
    steps:
      - name: 수트가 통과했는가
        env:
          GATE: ${{ needs.gate.result }}
          HAS_KEY: ${{ needs.gate.outputs.has_key }}
          FRESH: ${{ needs.gate.outputs.fresh }}
          EVAL: ${{ needs.eval.result }}
        run: |
          if [ "$GATE" != "success" ]; then
            echo "::error::gate 가 $GATE — 키 없이 도는 게이트부터 떨어졌다"; exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::자격(CLAUDE_CODE_OAUTH_TOKEN · ANTHROPIC_API_KEY)이 없어 감사자 수트가 안 돌았다 — 통과가 아니다"
            exit 1
          fi
          if [ "$FRESH" = "false" ]; then
            echo "같은 입력이 이미 통과했다 — 수트를 건너뛰었다(근거는 gate 의 notice)"; exit 0
          fi
          if [ "$EVAL" != "success" ]; then
            echo "::error::감사자 수트가 $EVAL"; exit 1
          fi
          echo "감사자 수트 통과"
