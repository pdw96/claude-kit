# 원본이 자기 수트를 통과하는지 무는 게이트.
#
# verify-copy.py 는 사본이 원본과 같은지만 본다 — 원본이 맞는지는 아무도 안
# 봤다. 이 워크플로가 그 자리다.
#
# 잡이 둘인 이유: 모델을 부르는 검사는 키가 있어야 돈다. 키가 없을 때 그 잡이
# exit 0 으로 끝나면 **아무것도 검사하지 않고 초록이 난다** — 이 저장소가
# 고치겠다는 바로 그 결함이다. 그래서 키 없이 도는 것(gate)과 키가 있어야
# 도는 것(eval)을 갈랐다.
#
# **판정은 셋째 잡(verdict)이 낸다.** 처음엔 「키가 없으면 eval 이 Skipped 로
# 뜨니 초록이 아니다」라고 적었는데 틀렸다 — GitHub 은 건너뛴 잡을 필수 체크에서
# **성공**으로 센다. 포크나 Dependabot PR 은 시크릿을 못 받으니 gate 만 돌고
# 초록으로 머지될 수 있었다(Codex 리뷰). verdict 는 늘 돌고, 수트가 돌아 통과했거나
# 같은 입력이 이미 통과했을 때만 통과한다. 필수 체크로 걸 것은 이 잡이다.
name: eval

on:
  # **PR 은 거르지 않는다.** verdict 를 필수 체크로 걸면, 경로 필터로 워크플로가
  # 아예 안 뜬 PR(루트 README 만 고친 PR 등)은 그 체크가 영영 대기로 남아 머지할 수
  # 없다(Codex 리뷰). 비싼 것은 잡 안에서 거른다 — 수트의 입력이 안 바뀐 PR 은
  # 지문이 같아 gate 가 캐시에서 「이미 통과」를 찾고 eval 을 건너뛴다. 전에 경로
  # 필터에 루트 파일을 하나씩 더해 가던 것(LICENSE · copies.json …)도 이로써 필요 없다.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# **같은 PR 의 앞선 실행은 취소한다.** 한 커밋에 pull_request 실행이 1초 차로 둘 떠 수트를
# 두 번 돌린 일이 있었고(run 35999877690 · 35999878954), 구독 토큰의 사용량 한도를 두 배로
# 썼다. 새 커밋을 올리면 앞 커밋의 수트도 쓸모가 없으므로 같이 끊는다.
concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 키 없이 도는 것. 언제나 물어야 한다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
      # 같은 지문이 이미 통과했으면 false. 찾아보지 않은 경우(workflow_dispatch)엔
      # cache-hit 이 비어 있어 true 가 된다 — 모르면 돈다.
      fresh: ${{ steps.seen.outputs.cache-hit != 'true' }}
    steps:
      # 역사 전체를 받는다. verify-copies.py 는 대장의 synced_commit 을 이 저장소에서
      # 찾고 그 커밋의 원본과 검사기로 사본을 견준다. 기본(깊이 1)이면 머리 커밋 하나만
      # 받아, 대장에 한 줄이라도 생기는 순간 「심었다는 커밋이 없다」로 gate 가 떨어진다
      # — sync-agents.sh 는 대장을 적는 커밋보다 앞선 HEAD 를 적으므로 늘 그렇다
      # (Codex 리뷰 · 깊이 1 클론에서 재현).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code

      - name: 키 없이 도는 게이트
        run: ./scripts/gates.sh

      - name: 게이트가 무는가
        run: |
          set -euo pipefail

          # verify-copy.py — tools 를 변조한 사본은 실패해야 한다
          python3 scripts/verify-copy.py vibe-audit/agents
          t=$(mktemp -d); cp vibe-audit/agents/*.md "$t/"
          sed -i 's/^tools: .*/tools: ["Read", "Grep", "Glob", "Edit"]/' "$t/audit-secrets.md"
          if python3 scripts/verify-copy.py "$t" >/dev/null 2>&1; then
            echo "::error::verify-copy.py 가 tools 변조를 통과시켰다"; exit 1
          fi

          # verify-brief.py — 「담지 않은 것」을 뺀 브리핑은 실패해야 한다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text()
          p.write_text(t[:t.find("## 이 브리핑이 담지 않은 것")])
          PY
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 「담지 않은 것」 없는 브리핑을 통과시켰다"; exit 1
          fi

          # verify-brief.py — 추적 안 된 파일 줄이 없거나, 자른 여부를 안 적었거나,
          # 「자름: 있음」인데 줄 수가 없거나 한 수만 있거나 맞지 않는 브리핑, 「커밋 안 된
          # 변경:」 값이 빈 브리핑은 실패해야 한다
          for m in untracked cut-missing cut-nocount cut-total cut-inverted wt-empty; do
            b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
            python3 - "$b/.claude/audit-brief.md" "$m" <<'PY'
          import re, sys, pathlib
          p, m = pathlib.Path(sys.argv[1]), sys.argv[2]; t = p.read_text()
          if m == "untracked":
              t = re.sub(r"^- 추적 안 된 파일:.*\n", "", t, flags=re.M)
          elif m == "cut-missing":
              t = re.sub(r"^- 자름:.*\n", "", t, flags=re.M)
          elif m == "cut-nocount":
              t = re.sub(r"^- 자름:.*$", "- 자름: 있음 — 뒤쪽을 잘랐다", t, flags=re.M)
          elif m == "cut-total":
              t = re.sub(r"^- 자름:.*$", "- 자름: 있음 — diff 전체 5000줄", t, flags=re.M)
          elif m == "cut-inverted":
              t = re.sub(r"^- 자름:.*$", "- 자름: 있음 — diff 전체 100줄 중 200줄", t, flags=re.M)
          else:
              t = re.sub(r"^- 커밋 안 된 변경:.*$", "- 커밋 안 된 변경:", t, flags=re.M)
          if m.startswith("cut-"):
              t += "- 뒤쪽을 잘랐다\n"
          p.write_text(t)
          PY
            if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
              echo "::error::verify-brief.py 가 변조($m)한 브리핑을 통과시켰다"; exit 1
            fi
          done
          # 두 수를 다 적고 자른 것을 「담지 않은 것」에 적은 브리핑은 통과해야 한다. 담았다는
          # M 은 diff 절의 실제 줄 수(픽스처는 30)와 맞아야 하고, 부풀리면 실패해야 한다
          for m in "30:pass" "2,000:fail"; do
            b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
            sed -i "s/^- 자름:.*/- 자름: 있음 — diff 전체 5,000줄 중 ${m%%:*}줄/" "$b/.claude/audit-brief.md"
            echo "- 뒤쪽을 잘랐다" >> "$b/.claude/audit-brief.md"
            if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then r=pass; else r=fail; fi
            if [ "$r" != "${m##*:}" ]; then
              echo "::error::verify-brief.py 가 「5,000줄 중 ${m%%:*}줄」(diff 30줄)에 $r 을 냈다 (${m##*:} 이어야)"; exit 1
            fi
          done
          # 「커밋 안 된 변경: 있음」은 백틱 경로가 있고 그 경로가 diff 의 `### 작업트리` 아래에
          # 나와야 통과한다. 커밋된 diff 에 같은 파일이 있는 것만으로는 안 된다(app/cache.py)
          for m in "있음 — 아래 diff 에 포함:fail" "있음 — \`app/other.py\`, 아래 diff 에 포함:fail" \
                   "있음 — \`app/cache.py\`, 아래 diff 에 포함:fail" "있음 — \`app/cache.py\`, 아래 diff 에 포함:pass-sub"; do
            b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
            sed -i "s|^- 커밋 안 된 변경:.*|- 커밋 안 된 변경: ${m%:*}|" "$b/.claude/audit-brief.md"
            if [ "${m##*:}" = pass-sub ]; then
              python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          wt = "### 작업트리\n\n```diff\ndiff --git a/app/cache.py b/app/cache.py\n--- a/app/cache.py\n+++ b/app/cache.py\n@@ -1,1 +1,1 @@\n-_store = {}\n+_store = dict()\n```\n\n"
          p.write_text(t.replace(h, wt + h))
          PY
              m="${m%:*}:pass"
            fi
            if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then r=pass; else r=fail; fi
            if [ "$r" != "${m##*:}" ]; then
              echo "::error::verify-brief.py 가 「커밋 안 된 변경: ${m%:*}」에 $r 을 냈다 (${m##*:} 이어야)"; exit 1
            fi
          done

          # 「담지 않은 것」을 diff 앞으로 옮기고 끝의 diff 절을 비운 브리핑은 실패해야 한다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          i, j = t.find("## diff"), t.find(h)
          p.write_text(t[:i] + t[j:].rstrip("\n") + "\n\n## diff\n\n")
          PY
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 순서가 뒤집히고 diff 가 빈 브리핑을 통과시켰다"; exit 1
          fi

          # sync-agents.sh — 대장에 있는 사본에 새 커맨드만 빠졌으면 심어야 한다. 감사자가 다
          # 있어 첫 고리가 전부 건너뛰면 HDR 이 안 정해져 `set -u` 로 죽었다
          c=$(mktemp -d); git clone -q "$GITHUB_WORKSPACE" "$c/src"; mkdir -p "$c/svc"
          HOME="$c" "$c/src/scripts/sync-agents.sh" "$c/svc" >/dev/null
          # 대장에는 홈 기준 경로를 적는다 — 절대 경로는 계정 이름 · 비공개 디렉터리를 커밋에 남긴다
          if ! grep -q '"agents_path": "~/svc/.claude/agents"' "$c/src/copies.json"; then
            echo "::error::sync-agents.sh 가 대장에 홈 기준이 아닌 경로를 적었다"; cat "$c/src/copies.json"; exit 1
          fi
          rm "$c/svc/.claude/commands/audit-brief.md"
          if ! HOME="$c" "$c/src/scripts/sync-agents.sh" "$c/svc" >"$c/out" 2>&1 || [ ! -f "$c/svc/.claude/commands/audit-brief.md" ]; then
            echo "::error::sync-agents.sh 가 빠진 커맨드를 못 심었다"; cat "$c/out"; exit 1
          fi

          # verify-evals.py — 대조군을 뺀 수트는 실패해야 한다
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          rm "$s"/vibe-audit/evals/*/graders/real-nc-found.md
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 대조군 없는 수트를 통과시켰다"; exit 1
          fi

          # verify-evals.py — input_match 가 subagent_type 에 안 걸린 그레이더는 실패해야 한다.
          # 이름만 적으면 입력 어디에 적혀 있기만 해도 뜬 것으로 센다. 공백을 넣은 JSON 은
          # 하네스가 펴는 모양과 달라 영영 안 맞으므로, 음성 그레이더가 늘 통과한다.
          for mut in \
            "s/^input_match: .*/input_match: audit-data/" \
            "s/\"subagent_type\":\"/\"subagent_type\": \"/"; do
            s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
            sed -i "$mut" "$s/vibe-audit/evals/route-contract/graders/route-not-data.md"
            if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
              echo "::error::verify-evals.py 가 subagent_type 에 안 걸린 input_match 를 통과시켰다 ($mut)"; exit 1
            fi
          done

          # verify-evals.py — route-quiet 이 감사자 하나만 짚으면 실패해야 한다
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          sed -i 's/"vibe-audit:'"'"'$/"vibe-audit:audit-data"'"'"'/' "$s/vibe-audit/evals/route-quiet/graders/route-quiet.md"
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 하나만 짚는 route-quiet 을 통과시켰다"; exit 1
          fi

          # verify-graders.py — 함정을 못 무는 그레이더는 실패해야 한다
          g=$(mktemp -d); cp -r vibe-audit "$g/"; rm -rf "$g/vibe-audit/evals/results"
          sed -i 's/NC-3\\\\b/NC-9\\\\b/' "$g/vibe-audit/evals/cycle-continuity/graders/trap-no-false-resolved.md"
          if python3 scripts/verify-graders.py "$g/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-graders.py 가 못 무는 그레이더를 통과시켰다"; exit 1
          fi

          # verify-budget.py — 문구가 자란 사본은 실패해야 한다
          u=$(mktemp -d); tar -c --exclude=.git --exclude=results . | tar -x -C "$u"
          python3 -c "
          import pathlib
          p = pathlib.Path('$u/vibe-audit/agents/audit-secrets.md')
          p.write_text(p.read_text() + '\n' + '규칙을 더 붙인다. ' * 200)
          "
          if python3 "$u/scripts/verify-budget.py" >/dev/null 2>&1; then
            echo "::error::verify-budget.py 가 자란 문구를 통과시켰다"; exit 1
          fi

          # verify-manifest.py — 선언한 라이선스의 파일이 없으면 실패해야 한다
          m=$(mktemp -d); tar -c --exclude=.git --exclude=results . | tar -x -C "$m"
          rm "$m/LICENSE"
          if python3 "$m/scripts/verify-manifest.py" >/dev/null 2>&1; then
            echo "::error::verify-manifest.py 가 LICENSE 없는 선언을 통과시켰다"; exit 1
          fi

          # verify-copies.py — 이 저장소에 없는 커밋을 적은 대장은 실패해야 한다.
          # 이 검사는 git 이력을 보므로 사본이 아니라 제자리에서 흔들고 되돌린다.
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("copies.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["copies"].append({"repo": "없는-레포", "agents_path": "/없는/자리",
                              "synced_commit": "0" * 40, "synced_at": "2026-01-01"})
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          if python3 scripts/verify-copies.py >/dev/null 2>&1; then
            git checkout -- copies.json
            echo "::error::verify-copies.py 가 없는 커밋을 적은 대장을 통과시켰다"; exit 1
          fi
          git checkout -- copies.json

          # 체크아웃이 얕으면 실패한다. verify-copies.py 는 대장의 synced_commit 을 이
          # 저장소에서 찾는데, sync-agents.sh 는 대장을 적는 커밋보다 앞선 HEAD 를 적는다.
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::체크아웃이 얕다 — 대장의 synced_commit 을 못 찾는다(fetch-depth: 0)"; exit 1
          fi

          # verify-copies.py — 그 커밋에서 그대로 심은 사본은 통과하고, 커맨드를 지운
          # 사본은 실패해야 한다. 적는 커밋은 머리보다 앞서면서 커맨드와 검사기를 가진
          # 가장 가까운 것 — sync-agents.sh 가 적는 모양이다. 없으면(스쿼시 머지 직후
          # main 처럼 커맨드가 한 커밋에서 처음 생긴 역사) 머리로 본다. 얕은지는 위에서
          # 따로 물므로, 역사의 모양을 얕은 것으로 오인하지 않는다(Codex 리뷰).
          c=$(mktemp -d); mkdir -p "$c/.claude/agents" "$c/.claude/commands"
          old=$(git rev-parse HEAD)
          for k in $(git rev-list --skip=1 --max-count=200 HEAD); do
            if git cat-file -e "$k:vibe-audit/commands/audit-brief.md" 2>/dev/null \
               && git cat-file -e "$k:scripts/verify-copy.py" 2>/dev/null; then
              old=$k; break
            fi
          done
          echo "사본을 심은 커밋으로 적는 것: $old"
          for f in $(git ls-tree --name-only "$old" vibe-audit/agents/ vibe-audit/commands/); do
            case "$f" in
              vibe-audit/agents/audit-*.md) git show "$old:$f" > "$c/.claude/agents/${f##*/}" ;;
              vibe-audit/commands/*.md)     git show "$old:$f" > "$c/.claude/commands/${f##*/}" ;;
            esac
          done
          python3 - "$c/.claude/agents" "$old" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("copies.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["copies"].append({"repo": "흔드는-사본", "agents_path": sys.argv[1],
                              "synced_commit": sys.argv[2], "synced_at": "2026-01-01"})
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          if ! python3 scripts/verify-copies.py; then
            git checkout -- copies.json
            echo "::error::verify-copies.py 가 HEAD~1 에서 그대로 심은 사본을 떨어뜨렸다 — 체크아웃이 얕은가"; exit 1
          fi
          # 감사자의 머리말 name 을 바꾼 사본도 실패해야 한다 — 문서가 적은 이름으로 안 불린다
          cp "$c/.claude/agents/audit-secrets.md" "$c/keep.md"
          sed -i '0,/^name: .*/s//name: renamed-secrets/' "$c/.claude/agents/audit-secrets.md"
          if python3 scripts/verify-copies.py >/dev/null 2>&1; then
            git checkout -- copies.json
            echo "::error::verify-copies.py 가 name 을 바꾼 감사자 사본을 통과시켰다"; exit 1
          fi
          mv "$c/keep.md" "$c/.claude/agents/audit-secrets.md"
          rm "$c/.claude/commands/audit-brief.md"
          if python3 scripts/verify-copies.py >/dev/null 2>&1; then
            git checkout -- copies.json
            echo "::error::verify-copies.py 가 /audit-brief 가 빠진 사본을 통과시켰다"; exit 1
          fi
          git checkout -- copies.json

          # run-evals.sh — 결정론 그레이더가 모든 회차에서 떨어지면 점수가 문턱을 넘어도
          # 실패해야 한다(종료코드 5). 한 회차만 떨어진 것은 흔들림이라 통과해야 한다.
          # 매번 떨어진 쪽은 회차가 점수로는 통과여도 트레이스 셋이 남아야 한다 — 실패
          # 산출물에 증거가 없으면 못 연다. 가짜 하네스가 --json 자리에 결과를 쓴다
          # — 모델은 안 부른다.
          f=$(mktemp -d)
          printf '%s\n' '#!/usr/bin/env bash' \
            'while [ $# -gt 0 ]; do [ "$1" = --json ] && cp "$FAKE_RESULT" "$2"; shift; done' > "$f/claude"
          chmod +x "$f/claude"
          for n in 3 1; do
            python3 - "$f/r$n.json" "$n" "$f/tr$n" <<'PY'
          import json, pathlib, sys
          out, fails, tr = sys.argv[1], int(sys.argv[2]), pathlib.Path(sys.argv[3])
          for i in range(3):
              (tr / f"r{i}").mkdir(parents=True, exist_ok=True)
              (tr / f"r{i}" / "trace.jsonl").write_text('{"type":"result","result":"ok","modelUsage":{"claude-sonnet-5":{}}}\n')
          gs = [("gate-holds", "regex", 3), ("handoff-named", "regex", 1), ("real-nc-found", "regex", 2)]
          # 러너는 디스크에 적힌 그레이더가 다 채점됐는지도 보므로 나머지는 통과로 채운다
          gs += [(p.stem, "llm", 1) for p in sorted(pathlib.Path("vibe-audit/evals/gate-out-of-scope/graders").glob("*.md"))
                 if p.stem not in {g for g, _, _ in gs}]
          runs = [{"score": 5 / 6 if i < fails else 1.0, "passed": True,
                   "tracePath": str(tr / f"r{i}" / "trace.jsonl"),
                   "graders": [{"name": g, "weight": w, "scored": True,
                                "passed": not (i < fails and g == "handoff-named")} for g, _, w in gs]}
                  for i in range(3)]
          json.dump({"cases": [{"name": "gate-out-of-scope", "arms": {"with": runs},
                                "graders": [{"name": g, "type": t, "weight": w} for g, t, w in gs],
                                "aggregates": {"score": sum(r["score"] for r in runs) / 3}}]},
                    open(out, "w"))
          PY
            set +e
            FAKE_RESULT="$f/r$n.json" PATH="$f:$PATH" ./scripts/run-evals.sh --case gate-out-of-scope --ablation none >"$f/o$n" 2>&1
