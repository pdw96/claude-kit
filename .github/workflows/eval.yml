          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          p.write_text(t[:t.find(h)] + h + "\n\n")
          PY
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 항목 없는 「담지 않은 것」을 통과시켰다"; exit 1
          fi

          # verify-brief.py — 머리에 적은 추적 안 된 파일이 본문에 없으면 실패해야 한다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          sed -i 's/^- 추적 안 된 파일: 없음/- 추적 안 된 파일: `app\/new.py` — 아래 diff 포함/' "$b/.claude/audit-brief.md"
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 본문에 없는 추적 안 된 파일을 통과시켰다"; exit 1
          fi

