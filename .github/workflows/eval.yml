          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          i = t.find("## diff")
          p.write_text(t[:i] + "## diff\n\ndiff --git a/deploy.sh b/deploy.sh\nold mode 100644\nnew mode 100755\n\n" + t[t.find(h):])
          PY
          if ! python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 모드만 바뀐 diff 를 빈 브리핑으로 버렸다"; exit 1
          fi

          # verify-brief.py — `추적 안 된 파일:` 값이 비면 실패해야 한다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          sed -i 's/^- 추적 안 된 파일: 없음.*/- 추적 안 된 파일:/' "$b/.claude/audit-brief.md"
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 빈 「추적 안 된 파일」 값을 통과시켰다"; exit 1
          fi

          # verify-brief.py — diff 절에 헝크 없이 「- git diff 실패: …」 목록만 있으면 빈 브리핑이다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          i = t.find("## diff")
          p.write_text(t[:i] + "## diff\n\n- git diff 실패: 기준을 읽을 수 없음\n\n" + t[t.find(h):])
          PY
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 실패 기록 목록만 있는 diff 를 통과시켰다"; exit 1
          fi

          # verify-brief.py — 머리가 적은 줄 수보다 짧은 헝크(`@@ -1 +1 @@` 뒤 `-old` 만)는 끊긴 diff 다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          i = t.find("## diff")
          p.write_text(t[:i] + "## diff\n\n```diff\ndiff --git a/app/x.py b/app/x.py\n--- a/app/x.py\n+++ b/app/x.py\n@@ -1 +1 @@\n-old\n\n```\n\n" + t[t.find(h):])
          PY
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 끊긴 헝크를 통과시켰다"; exit 1
          fi

          # verify-brief.py — `old mode` 한 줄에서 끊긴 메타데이터만 있는 diff 는 빈 브리핑이다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          i = t.find("## diff")
          p.write_text(t[:i] + "## diff\n\ndiff --git a/deploy.sh b/deploy.sh\nold mode 100644\n\n" + t[t.find(h):])
          PY
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 짝이 끊긴 메타데이터 diff 를 통과시켰다"; exit 1
          fi

          # verify-brief.py — 헝크 **안의** `--- a/…` 는 본문이다(`-- a/query` 를 지운 줄). 통과해야 한다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          i = t.find("## diff")
          p.write_text(t[:i] + "## diff\n\n```diff\ndiff --git a/q.sql b/q.sql\n--- a/q.sql\n+++ b/q.sql\n@@ -1,2 +1 @@\n--- a/query\n select 1\n```\n\n" + t[t.find(h):])
          PY
          if ! python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 헝크 안의 --- a/ 본문 줄을 파일 머리로 읽었다"; exit 1
          fi

          # verify-brief.py — 파일 머리(--- a/ · +++ b/)만 남은 diff 는 빈 브리핑이다
          b=$(mktemp -d); (cd "$b" && bash "$GITHUB_WORKSPACE/vibe-audit/evals/brief-used/fixture.sh")
          python3 - "$b/.claude/audit-brief.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text(); h = "## 이 브리핑이 담지 않은 것"
          i = t.find("## diff")
          p.write_text(t[:i] + "## diff\n\ndiff --git a/app/routes.py b/app/routes.py\n--- a/app/routes.py\n+++ b/app/routes.py\n\n" + t[t.find(h):])
          PY
          if python3 scripts/verify-brief.py "$b/.claude/audit-brief.md" >/dev/null 2>&1; then
            echo "::error::verify-brief.py 가 파일 머리만 남은 diff 를 통과시켰다"; exit 1
          fi

          # verify-evals.py — 채점 그레이더에 arm 을 붙이면(점수에서 빠짐) 실패해야 한다
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          sed -i '0,/^weight/s//arm: with-only\nweight/' "$s/vibe-audit/evals/route-unasked-data/graders/route-correct.md"
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 arm 붙은 route-correct 를 통과시켰다"; exit 1
          fi

          # verify-evals.py — 떨어져도 문턱을 못 넘기는 가벼운 음성 그레이더는 실패해야 한다
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          sed -i 's/^weight: .*/weight: 1/' "$s/vibe-audit/evals/route-unasked-data/graders/route-not-secrets.md"
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 문턱 아래로 못 끌어내리는 음성 그레이더를 통과시켰다"; exit 1
          fi

          # verify-graders.py — 무엇에나 맞는 대조군은 실패해야 한다(무는 fail 표본이 있어야)
          g=$(mktemp -d); cp -r vibe-audit "$g/"; rm -rf "$g/vibe-audit/evals/results"
          sed -i 's/^pattern: .*/pattern: "."/' "$g/vibe-audit/evals/trap-local-dev-password/graders/real-nc-found.md"
          if python3 scripts/verify-graders.py "$g/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-graders.py 가 무엇에나 맞는 대조군을 통과시켰다"; exit 1
          fi

          # verify-copy.py — 원본 여섯 가운데 하나만 공통 절이 갈리면 실패해야 한다
          # (gates.sh 는 원본을 원본과 견주므로 파일마다 자기 자신과 같다)
          t=$(mktemp -d); cp vibe-audit/agents/*.md "$t/"
          sed -i '/^## 판정은 넷이다$/{n;s/$/ 갈림/}' "$t/audit-secrets.md"
          if python3 scripts/verify-copy.py "$t" "$t" >/dev/null 2>&1; then
            echo "::error::verify-copy.py 가 원본끼리 갈린 공통 절을 통과시켰다"; exit 1
          fi

          # verify-copy.py — 머리말에 Edit 를 넣고 본문에 원형 tools 줄을 적어 두면 실패해야 한다
          t=$(mktemp -d); cp vibe-audit/agents/*.md "$t/"
          sed -i 's/^tools: .*/tools: ["Read", "Grep", "Glob", "Edit"]/' "$t/audit-ops.md"
          printf '\n예시:\ntools: ["Read", "Grep", "Glob"]\n' >> "$t/audit-ops.md"
          if python3 scripts/verify-copy.py "$t" >/dev/null 2>&1; then
            echo "::error::verify-copy.py 가 본문의 원형 줄에 속아 쓰기 도구를 통과시켰다"; exit 1
          fi

          # verify-copy.py — 출력 형식에서 `## 지난 회차` 를 빼고 파일 끝에 딴 절로 붙인 사본은 실패해야 한다
          t=$(mktemp -d); cp vibe-audit/agents/*.md "$t/"
          python3 - "$t/audit-secrets.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text()
          j = t.find("## 지난 회차\n", t.find("## 출력 형식"))
          p.write_text(t[:j] + t[j + len("## 지난 회차\n"):] + "\n## 지난 회차\n\n딴 절\n")
          PY
          if python3 scripts/verify-copy.py vibe-audit/agents "$t" >/dev/null 2>&1; then
            echo "::error::verify-copy.py 가 출력 형식 밖의 「지난 회차」에 속았다"; exit 1
          fi

          # verify-copy.py — 출력 형식의 `## 안 본 것` 머리만 지우고 자리표시를 남긴 사본은 실패해야 한다
          t=$(mktemp -d); cp vibe-audit/agents/*.md "$t/"
          python3 - "$t/audit-secrets.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); t = p.read_text()
          j = t.find("## 안 본 것\n", t.find("## 출력 형식"))
          p.write_text(t[:j] + t[j + len("## 안 본 것\n"):])
          PY
          if python3 scripts/verify-copy.py vibe-audit/agents "$t" >/dev/null 2>&1; then
            echo "::error::verify-copy.py 가 출력 형식의 「안 본 것」 머리가 빠진 사본을 통과시켰다"; exit 1
          fi

          # verify-evals.py — route-not-others 가 없거나 허용 선언과 어긋나면 실패해야 한다
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          rm "$s/vibe-audit/evals/route-unasked-secret/graders/route-not-others.md"
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 route-not-others 없는 route 케이스를 통과시켰다"; exit 1
          fi
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          sed -i 's/^같이 떠도 되는 감사자: .*/같이 떠도 되는 감사자: 없음/' \
            "$s/vibe-audit/evals/route-unasked-secret/graders/route-not-others.md"
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 허용 선언과 어긋난 route-not-others 를 통과시켰다"; exit 1
          fi

          # verify-evals.py — scaffold_script 선언이 빠진 케이스는 실패해야 한다
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          sed -i '/scaffold_script/d' "$s/vibe-audit/evals/route-quiet/case.yaml"
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 스캐폴드 없는 케이스를 통과시켰다"; exit 1
          fi

          # verify-manifest.py — 검사가 모르는 라이선스 선언은 실패해야 한다
          m=$(mktemp -d); tar -c --exclude=.git --exclude=results . | tar -x -C "$m"
          sed -i 's/"license": "MIT"/"license": "GPL-3.0"/' "$m/vibe-audit/.claude-plugin/plugin.json"
          if python3 "$m/scripts/verify-manifest.py" >/dev/null 2>&1; then
            echo "::error::verify-manifest.py 가 견줄 수 없는 라이선스 선언을 통과시켰다"; exit 1
          fi

          echo "게이트 일곱 중 변조본으로 확인한 일곱: manifest · copies · copy · brief · evals · graders · budget"

          # eval-key.py — 수트가 안 읽는 것은 지문을 그대로 두고, 읽는 것은 바꿔야 한다.
          # 앞쪽이 깨지면 낭비로 끝나지만 뒤쪽이 깨지면 **문구를 고친 PR 이 수트 없이
          # 지나간다.** 제자리에서 흔들고 그 파일만 되돌린다(커밋 안 한 수정이 있는
          # 로컬에서 돌리면 그 수정도 되돌아간다 — CI 에서만 돌린다).
          k0=$(python3 scripts/eval-key.py route)
          keyed() {  # $1=same|diff  $2=파일  $3=흔드는 명령
            eval "$3"
            k=$(python3 scripts/eval-key.py route); git checkout -q -- "$2"
            if [ "$1" = same ] && [ "$k" != "$k0" ]; then
              echo "::error::eval-key.py 가 수트와 무관한 $2 로 지문을 바꿨다"; exit 1
            fi
            if [ "$1" = diff ] && [ "$k" = "$k0" ]; then
              echo "::error::eval-key.py 가 $2 를 바꿔도 지문이 그대로다 — 수트 없이 지나간다"; exit 1
            fi
          }
          keyed same vibe-audit/evals/README.md                     'echo x >> vibe-audit/evals/README.md'
          keyed same vibe-audit/README.md                           'echo x >> vibe-audit/README.md'
          keyed same vibe-audit/evals/budget.txt                    'echo x >> vibe-audit/evals/budget.txt'
          keyed same vibe-audit/evals/trap-liveness-probe/prompt.md 'echo x >> vibe-audit/evals/trap-liveness-probe/prompt.md'
          keyed diff vibe-audit/agents/audit-data.md                'echo x >> vibe-audit/agents/audit-data.md'
          keyed diff vibe-audit/evals/route-quiet/prompt.md         'echo x >> vibe-audit/evals/route-quiet/prompt.md'
          keyed diff scripts/verify-graders.py                      "echo '#' >> scripts/verify-graders.py"
          keyed diff .github/workflows/eval.yml                     "echo '#' >> .github/workflows/eval.yml"
          keyed diff vibe-audit/commands/audit-brief.md             'rm vibe-audit/commands/audit-brief.md'
          keyed diff scripts/run-evals.sh                           'chmod -x scripts/run-evals.sh'
          if [ "$(python3 scripts/eval-key.py full)" = "$k0" ]; then
            echo "::error::eval-key.py 의 지문에 모드가 안 들었다"; exit 1
          fi
          echo "수트 지문: 무관한 넷은 그대로, 관련된 여섯(실행 비트 포함)과 모드는 바뀐다"

      # 자격은 둘 중 하나다 — 구독 토큰(`claude setup-token` 이 만든
      # CLAUDE_CODE_OAUTH_TOKEN) 또는 API 키(ANTHROPIC_API_KEY). 저자는 구독을 쓴다.
      - name: 키가 있는가
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${OAUTH:-}" ] || [ -n "${API_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN 도 ANTHROPIC_API_KEY 도 없어 감사자 수트가 돌지 않는다 — verdict 잡이 실패한다"
          fi

      # **같은 입력이 이미 통과했으면 수트를 다시 안 돌린다.** 구독 사용량에서
      # 한 번에 24회가 나가는데, README 만 고친 커밋에도 그것을 썼다. 지문은
      # scripts/eval-key.py 가 내용으로 만든다(무엇이 드는지는 그 파일 머리에).
      #
      # 통과한 실행만 지문을 적는다(아래 eval 잡 끝). 그래서 빨간 커밋 뒤에 README
      # 한 줄을 얹어도 지문이 **통과한 적 없는** 것이라 다시 돈다. 사람이 부른
      # workflow_dispatch 는 찾아보지 않고 늘 돈다.
      #
      # 그래도 다시 돌리고 싶으면 Actions → Caches 에서 `eval-route-` 로 시작하는
      # 항목을 지우고 재실행한다.
      - name: 수트 지문
        id: fp
        if: steps.key.outputs.has_key == 'true'
        run: echo "key=$(python3 scripts/eval-key.py route)" >> "$GITHUB_OUTPUT"

      - name: 같은 입력이 이미 통과했는가
        id: seen
        if: steps.key.outputs.has_key == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .eval-pass
          key: ${{ steps.fp.outputs.key }}

      # 건너뛴 eval 잡은 키가 없을 때와 똑같이 Skipped 로 뜬다. 둘은 verdict 가
      # 가르고(키 없음은 실패), 여기서는
      # 무엇을 근거로 건너뛰었는지 볼 수 있게 통과했던 실행을 찍는다.
      - name: 건너뛰는 근거
        if: steps.seen.outputs.cache-hit == 'true'
        run: |
          echo "::notice::수트를 건너뛴다 — 같은 입력(${{ steps.fp.outputs.key }})이 이미 통과했다: $(cat .eval-pass/run.txt)"

  # 키가 있어야 도는 것. 없으면 Skipped 로 뜨고, 판정은 아래 verdict 가 낸다.
  #
  # **무엇을 얼마나 돌리나 — 저자가 정했다(2026-09-23).** PR 과 push 는
  # 트리거 케이스(`route-*`)만, 판정 케이스까지 도는 전수는 workflow_dispatch
  # 로 사람이 부를 때만. 트리거는 문구를 고친 PR 에서 가장 자주 깨지는 축이고
  # 심판을 안 써서 싸다(여섯 × 3회, 약 $5). 전수는 심판(sonnet)까지 불러
  # 열 배쯤 든다.
  #
  # **러너를 부르는 이유.** 전에는 여기서 `claude plugin eval` 을 직접 불렀다.
  # 그러면 러너가 박아 둔 것이 전부 빠진다 — 동시성(기본 1 이라 전수가 두
  # 시간), 케이스 0개면 실패, 실패 트레이스 보존. 그리고 플러그인 없는 팔이
  # 기본으로 붙어 비용이 두 배가 되어, 키를 넣는 순간 `--max-cost-usd 10` 에
  # 걸려 **모든 PR 이 빨갛게** 떴을 것이다. 깃발을 두 군데 적으면 갈린다 —
  # `gates.sh` 를 만든 것과 같은 이유다.
  #
  # `--ablation none` — 플러그인 없는 팔은 감사자를 부를 수 없어 트리거
  # 케이스에서 늘 0 이다. 재는 것이 없는데 값은 두 배다.
  eval:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.has_key == 'true' && needs.gate.outputs.fresh == 'true'
    # 전수의 CI 실측은 아직 없다. README 의 123분은 동시성이 1 이던 때 열세 케이스를
    # 잰 것이고, 지금은 -j 4 · 열여덟 케이스다. 설치와 자격 확인까지 한 잡에 들어가므로
    # 넉넉히 둔다 — 잘리면 결과도 아티팩트도 안 남는다(Codex 리뷰).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code

      # **이 자격을 받는 사람은 쓰기 권한자뿐이다 — 저자가 이 위험을 받아들였다.**
      # 같은 저장소 브랜치의 PR 은 저장소 시크릿을 받고, PR 이 고친 스크립트와
      # 워크플로가 그 자격으로 돈다(Codex 7차). 포크 · Dependabot PR 은 시크릿을 못
      # 받고 verdict 가 빨갛게 둔다. 지금 쓰기 권한자는 저자 한 명이다.
      # **협업자를 들이면** 시크릿을 저장소 시크릿에서 승인자가 걸린 environment 로
      # 옮기고 이 잡에 `environment:` 를 건다 — 스크립트를 기준 브랜치에서 가져오는
      # 것으로는 안 막힌다. pull_request 는 PR 쪽의 워크플로 파일로 돈다.
      #
      # **하나만 내보낸다.** 둘 다 env 에 두면 비어 있는 쪽도 「설정됨」으로 읽혀
      # 다른 쪽을 가릴 수 있다 — CLI 는 ANTHROPIC_API_KEY 를 먼저 본다. 둘 다
      # 있으면 구독 토큰을 쓴다.
      #
      # **먼저 한 턴으로 자격을 확인한다.** 자격이 안 먹으면 수트는 회차마다
      # 오류로 0 점을 내고, 그것은 「감사자가 안 떴다」와 모양이 같다. 여기서
      # 먼저 떨어지면 원인이 자격이라는 것이 로그 첫 줄에 남는다.
      - name: 감사자 수트
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -n "${OAUTH:-}" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH"; echo "자격: 구독 토큰"
          else
            export ANTHROPIC_API_KEY="$API_KEY"; echo "자격: API 키"
          fi
          unset OAUTH API_KEY

          if ! out=$(claude -p "OK 한 단어로만 답하라" --max-turns 1 2>&1); then
            echo "::error::자격 확인 실패 — 수트를 돌리지 않는다: ${out:0:300}"; exit 1
          fi
          echo "자격 확인: ${out:0:40}"

          if [ "$FULL" = "true" ]; then
            ./scripts/run-evals.sh --ablation none --runs 3 --threshold 0.8 --max-cost-usd 40
          else
            # route 는 문턱 1.0 — 세 회차 **전부** 맞아야 한다. 문턱은 회차 평균에 걸리므로
            # 0.8 이면 한 회차의 과잉 트리거가 (1 + 1 + 0.67) / 3 = 0.89 로 지나가고, 그
            # 입력이 캐시에 「통과」로 남는다(Codex 리뷰). route 는 심판 없는 결정론 채점이고
            # 실측이 여러 번 24/24 라 흔들림 여유를 둘 까닭이 없다. 판정 케이스(전수)는 심판이
            # 갈리므로 0.8 을 둔다.
            ./scripts/run-evals.sh --case 'route-*' --ablation none --runs 3 --threshold 1.0 --max-cost-usd 10
          fi

      # 통과한 입력만 적어 둔다. 지문은 이 잡에서 다시 낸다 — gate 잡과 CLI 가
      # 사이에 올라갔으면 실제로 돈 쪽의 지문을 적어야 하기 때문이다. 전수
      # (workflow_dispatch)는 찾아보지도 않으므로 적지 않는다.
      - name: 통과한 입력을 적는다
        id: pass
        if: success() && github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p .eval-pass
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_SHA)" > .eval-pass/run.txt
          echo "key=$(python3 scripts/eval-key.py route)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v4
        if: steps.pass.outcome == 'success'
        with:
          path: .eval-pass
          key: ${{ steps.pass.outputs.key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-result
          path: vibe-audit/evals/results/
          if-no-files-found: ignore

  # **판정.** 건너뛴 잡은 GitHub 에서 성공으로 센다 — 그래서 「Skipped 는 초록이
  # 아니다」는 워크플로 모양만으로는 서지 않는다. 이 잡이 늘 돌아 다음 둘 중
  # 하나일 때만 통과한다: 감사자 수트가 돌아 통과했다, 또는 같은 입력이 이미
  # 통과했다(gate 의 지문 캐시). 자격이 없어 안 돈 것은 **실패**다 — 안 돌린 것을
  # 통과로 세지 않는다.
  verdict:
    runs-on: ubuntu-latest
    needs: [gate, eval]
    if: always()
    steps:
      - name: 수트가 통과했는가
        env:
          GATE: ${{ needs.gate.result }}
          HAS_KEY: ${{ needs.gate.outputs.has_key }}
          FRESH: ${{ needs.gate.outputs.fresh }}
          EVAL: ${{ needs.eval.result }}
        run: |
          if [ "$GATE" != "success" ]; then
            echo "::error::gate 가 $GATE — 키 없이 도는 게이트부터 떨어졌다"; exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::자격(CLAUDE_CODE_OAUTH_TOKEN · ANTHROPIC_API_KEY)이 없어 감사자 수트가 안 돌았다 — 통과가 아니다"
            exit 1
          fi
          if [ "$FRESH" = "false" ]; then
            echo "같은 입력이 이미 통과했다 — 수트를 건너뛰었다(근거는 gate 의 notice)"; exit 0
          fi
          if [ "$EVAL" != "success" ]; then
            echo "::error::감사자 수트가 $EVAL"; exit 1
          fi
          echo "감사자 수트 통과"
