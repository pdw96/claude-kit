# 원본이 자기 수트를 통과하는지 무는 게이트.
#
# verify-copy.py 는 사본이 원본과 같은지만 본다 — 원본이 맞는지는 아무도 안
# 봤다. 이 워크플로가 그 자리다.
#
# 잡이 둘인 이유: 모델을 부르는 검사는 키가 있어야 돈다. 키가 없을 때 그 잡이
# exit 0 으로 끝나면 **아무것도 검사하지 않고 초록이 난다** — 이 저장소가
# 고치겠다는 바로 그 결함이다. 그래서 키 없이 도는 것(gate)과 키가 있어야
# 도는 것(eval)을 갈라, 후자는 키가 없으면 통과가 아니라 **Skipped** 로 뜬다.
name: eval

on:
  pull_request:
    paths:
      - "vibe-audit/**"
      - "scripts/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 키 없이 도는 것. 언제나 물어야 한다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code

      - name: 플러그인 매니페스트
        run: claude plugin validate ./vibe-audit

      - name: 수트가 물 수 있는 모양인가
        run: python3 scripts/verify-evals.py

      # 게이트 둘이 실제로 무는지 매번 확인한다. 물지 않는 검사는 게이트가
      # 아니므로, 통과하는 것만 보고 통과라고 하지 않는다.
      - name: 게이트가 무는가
        run: |
          set -euo pipefail

          # verify-copy.py — tools 를 변조한 사본은 실패해야 한다
          python3 scripts/verify-copy.py vibe-audit/agents
          t=$(mktemp -d); cp vibe-audit/agents/*.md "$t/"
          sed -i 's/^tools: .*/tools: ["Read", "Grep", "Glob", "Edit"]/' "$t/audit-secrets.md"
          if python3 scripts/verify-copy.py "$t" >/dev/null 2>&1; then
            echo "::error::verify-copy.py 가 tools 변조를 통과시켰다"; exit 1
          fi

          # verify-evals.py — 대조군을 뺀 수트는 실패해야 한다
          s=$(mktemp -d); cp -r vibe-audit "$s/"; rm -rf "$s/vibe-audit/evals/results"
          rm "$s"/vibe-audit/evals/*/graders/real-nc-found.md
          if python3 scripts/verify-evals.py "$s/vibe-audit/evals" >/dev/null 2>&1; then
            echo "::error::verify-evals.py 가 대조군 없는 수트를 통과시켰다"; exit 1
          fi

          echo "둘 다 변조본에서 실패 확인"

      - name: 키가 있는가
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY 가 없어 감사자 수트가 돌지 않는다 — eval 잡은 Skipped 로 뜬다. 초록이 통과를 뜻하지 않는다"
          fi

  # 키가 있어야 도는 것. 없으면 Skipped 로 뜬다 — 초록이 아니다.
  eval:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.has_key == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code

      - name: 감사자 수트
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --judge-model sonnet 은 선택이 아니다. 기본 심판(haiku)은 이 수트의
          # 감사 기록에서 아홉 번 어긋나는 동안 한 번도 맞지 않았다 —
          # trap-rollback-unproven 이 haiku 0.278 / sonnet 1.000 이다.
          claude plugin eval ./vibe-audit \
            --scaffold --trust-plugin --no-publish \
            --judge-model sonnet \
            --runs 3 --threshold 0.8 --max-cost-usd 10 \
            --json eval-result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-result
          path: |
            eval-result.json
            vibe-audit/evals/results/
          if-no-files-found: ignore
